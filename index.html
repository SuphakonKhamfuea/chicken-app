<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Breeding Record</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        brand: { green: '#1F4E3D', cream: '#F9F6F0', brown: '#5C4033', accent: '#D4A373' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://ptquiexaqmgbglhozzfw.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0cXVpZXhhcW1nYmdsaG96emZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NzMyNjUsImV4cCI6MjEwNDI0OTI2NX0.fO7VdqGmwYSL-UB8JYKCrJ4xmPzfaPNyvkMYvbFRsro";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen">

<div id="root" class="w-full max-w-md h-screen bg-brand-cream relative overflow-hidden shadow-2xl flex flex-col"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
        const [chickens, setChickens] = useState([]);
        const [view, setView] = useState('home');
        const [ringNumber, setRingNumber] = useState('');
        const [name, setName] = useState('');
        const [loading, setLoading] = useState(false);

        const fetchChickens = async () => {
            try {
                const { data, error } = await supabase.from('chickens').select('*').order('created_at', { ascending: false });
                if (error) console.error("Error:", error);
                else setChickens(data || []);
            } catch (e) {
                console.error(e);
            }
        };

        useEffect(() => {
            fetchChickens();
        }, []);

        const saveChicken = async () => {
            if (!ringNumber) return alert("กรุณากรอกหมายเลขกิ๊ฟปีก");
            setLoading(true);
            const { error } = await supabase.from('chickens').insert([{ ringNumber, name }]);
            setLoading(false);
            if (error) alert("เกิดข้อผิดพลาด: " + error.message);
            else {
                setRingNumber('');
                setName('');
                setView('home');
                fetchChickens();
            }
        };

        return (
            <div className="flex-1 flex flex-col h-full">
                <div className="bg-brand-green text-white p-4 text-center font-bold text-lg">
                    Chicken Breeding Record
                </div>
                
                <div className="flex-1 p-4 overflow-y-auto">
                    {view === 'home' ? (
                        <div>
                            <button onClick={() => setView('add')} className="w-full bg-brand-accent text-white py-3 rounded-lg font-semibold mb-4">
                                + เพิ่มข้อมูลไก่
                            </button>
                            <h2 className="font-semibold text-brand-brown mb-2">รายการไก่ทั้งหมด ({chickens.length})</h2>
                            <div className="space-y-2">
                                {chickens.map(c => (
                                    <div key={c.id} className="bg-white p-3 rounded-lg shadow border flex justify-between">
                                        <span className="font-semibold">{c.name || 'ไม่มีชื่อ'}</span>
                                        <span className="text-sm bg-gray-100 px-2 py-1 rounded">#{c.ringNumber}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="bg-white p-4 rounded-lg shadow space-y-3">
                            <h2 className="font-bold text-brand-brown">เพิ่มข้อมูลไก่ใหม่</h2>
                            <div>
                                <label className="block text-sm font-medium mb-1">หมายเลขกิ๊ฟปีก *</label>
                                <input type="text" value={ringNumber} onChange={e => setRingNumber(e.target.value)} className="w-full border p-2 rounded" placeholder="เช่น 001" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">ชื่อไก่</label>
                                <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full border p-2 rounded" placeholder="เช่น เจ้าพายุ" />
                            </div>
                            <div className="flex gap-2 pt-2">
                                <button onClick={() => setView('home')} className="flex-1 border p-2 rounded">ยกเลิก</button>
                                <button onClick={saveChicken} disabled={loading} className="flex-1 bg-brand-green text-white p-2 rounded">
                                    {loading ? 'กำลังบันทึก...' : 'บันทึก'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>

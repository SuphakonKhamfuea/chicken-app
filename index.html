<script type="text/babel">
    const { useState, useEffect } = React;

    // ฟังก์ชันย่อขนาดภาพอัตโนมัติเพื่อให้กดบันทึกได้เร็วไม่ค้าง
    const compressImage = (base64Str, maxWidth = 350, maxHeight = 350) => {
        return new Promise((resolve) => {
            let img = new Image();
            img.src = base64Str;
            img.onload = () => {
                let canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                } else {
                    if (height > maxHeight) {
                        width = Math.round((width * maxHeight) / height);
                        height = maxHeight;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                let ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.6));
            };
        });
    };

    function App() {
        const [chickens, setChickens] = useState([]);
        const [currentTab, setCurrentTab] = useState('home');
        const [view, setView] = useState({ name: 'home', params: null });
        const [searchQuery, setSearchQuery] = useState('');
        const [isSaving, setIsSaving] = useState(false);

        const fetchChickens = async () => {
            try {
                const { data, error } = await supabase.from('chickens').select('*').order('created_at', { ascending: false });
                if (error) console.error("Error fetching chickens:", error);
                else setChickens(data || []);
            } catch (e) {
                console.error("Fetch Exception:", e);
            }
        };

        useEffect(() => {
            fetchChickens();
            // ระบบดึงข้อมูลเรียลไทม์เมื่อมีการอัปเดต
            const channel = supabase.channel('realtime_chickens')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'chickens' }, () => fetchChickens())
                .subscribe();

            return () => { supabase.removeChannel(channel); };
        }, []);

        const navigateTo = (viewName, params = null) => {
            setView({ name: viewName, params });
            if (['home', 'parents', 'bands', 'settings'].includes(viewName)) setCurrentTab(viewName);
        };
        
        const saveChicken = async (data) => {
            if (!data.ringNumber) {
                alert("กรุณากรอกหมายเลขกิ๊ฟปีก");
                return;
            }
            setIsSaving(true);
            try {
                const chickenData = { ...data };
                const id = chickenData.id;
                delete chickenData.id;

                if (id) {
                    const { error } = await supabase.from('chickens').update(chickenData).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabase.from('chickens').insert([chickenData]);
                    if (error) throw error;
                }
                await fetchChickens();
                navigateTo('home');
            } catch (error) {
                alert("บันทึกไม่สำเร็จ: " + error.message);
                console.error(error);
            }
            setIsSaving(false);
        };

        const deleteChicken = async (id) => {
            if(confirm('ต้องการลบข้อมูลนี้ใช่หรือไม่?')) {
                const { error } = await supabase.from('chickens').delete().eq('id', id);
                if (error) alert("ลบไม่สำเร็จ: " + error.message);
                else {
                    await fetchChickens();
                    navigateTo('home');
                }
            }
        };

        const TopBar = ({ title, showBack }) => (
            <div className="bg-brand-green text-white p-4 pt-6 rounded-b-2xl shadow-md z-10 flex items-center justify-between">
                {showBack ? (

                ) : <div className="w-10"></div>}

                <div className="w-10"></div>

        );

        const Dashboard = () => {

                                value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                        </div>
                    </div>
                    <div className="p-4 grid grid-cols-2 gap-4 mt-4">
                        {[
                            { id: 'bands', title: 'กิ๊ฟปีกทั้งหมด', icon: 'fa-tags', color: 'text-blue-600', count: chickens.length },
                            { id: 'parents', title: 'พ่อพันธุ์', icon: 'fa-mars', color: 'text-brand-green', count: chickens.filter(c=>c.type==='พ่อพันธุ์').length },
                            { id: 'parents', title: 'แม่พันธุ์', icon: 'fa-venus', color: 'text-pink-600', count: chickens.filter(c=>c.type==='แม่พันธุ์').length },

                                </div>

                                {filtered.map(c => (
                                    <div key={c.id} onClick={() => navigateTo('detail', c.id)} className="bg-white p-3 rounded-xl shadow-sm flex items-center gap-4 cursor-pointer active:bg-gray-50 border border-gray-100">
                                        <div className="w-16 h-16 rounded-lg bg-gray-20 overflow-hidden flex-shrink-0 border border-gray-200">
                                            {c.images && c.images.length > 0 ? 
                                                <img src={c.images[0]} className="w-full h-full object-cover" /> : 
                                                <div className="w-full h-full flex items-center justify-center bg-gray-100 text-gray-400"><i className="fa-solid fa-camera"></i></div>

                                        </div>

                                            </div>
                                            <p className="text-sm text-gray-500">{c.type} • {c.breed}</p>

        };

        const ParentsView = () => {

            const mothers = chickens.filter(c => c.type === 'แม่พันธุ์');

                                    </div>
                                    <div className="text-center w-full">

                                        <div className="mt-1"><span className="text-[10px] bg-brand-cream text-brand-brown px-2 py-0.5 rounded-full border border-gray-200">#{c.ringNumber}</span></div>

                            {mothers.map(c => (

                                    <div className="w-20 h-20 rounded-full bg-gray-100 overflow-hidden border-2 border-pink-500">
                                        {c.images && c.images.length > 0 ? <img src={c.images[0]} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center"><i className="fa-solid fa-venus text-3xl text-pink-500 opacity-50"></i></div>}
                                    </div>

                                        <div className="mt-1"><span className="text-[10px] bg-pink-50 text-pink-700 px-2 py-0.5 rounded-full border border-pink-100">#{c.ringNumber}</span></div>
                                    </div>
                                </div>

        const AddForm = ({ initialValues = {} }) => {

            return (
                <div className="flex-1 flex flex-col h-full bg-brand-cream">
                    <TopBar title={formData.id ? "แก้ไขข้อมูล" : "เพิ่มข้อมูลใหม่"} showBack={true} />
                    <div className="flex-1 overflow-y-auto p-4 pb-24 space-y-4">
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                            <input type="file" id="imageUpload" accept="image/*" className="hidden" 
                                onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                        const reader = new FileReader();
                                        reader.onloadend = async () => {

                                        };

                                    }
                                }} 
                            />
                            <label htmlFor="imageUpload" className="cursor-pointer block">
                                {formData.images && formData.images.length > 0 ? (
                                    <div className="relative w-32 h-32 mx-auto mb-2">

                                        <div className="absolute -top-2 -right-2 bg-brand-accent text-white w-8 h-8 rounded-full flex items-center justify-center shadow-md"><i className="fa-solid fa-pen text-xs"></i></div>
                                    </div>
                                ) : (
                                    <div className="w-24 h-24 mx-auto rounded-full bg-gray-50 flex items-center justify-center text-brand-green mb-2 border-2 border-dashed border-brand-green bg-opacity-10"><i className="fa-solid fa-camera text-2xl"></i></div>
                                )}
                                <span className="text-sm text-brand-green font-medium">{formData.images && formData.images.length > 0 ? 'เปลี่ยนรูปภาพ' : '+ เพิ่มรูปภาพ'}</span>
                            </label>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4 text-brand-brown">

                            <div><label className="block text-sm font-medium mb-1">ชื่อไก่</label><input type="text" className="w-full border border-gray-300 rounded-lg p-3 outline-none" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium mb-1">สถานะ</label><select className="w-full border border-gray-300 rounded-lg p-3 outline-none bg-white" value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})}><option>ลูกไก่</option><option>พ่อพันธุ์</option><option>แม่พันธุ์</option></select></div>
                                <div><label className="block text-sm font-medium mb-1">สายเลือด/สายพันธุ์</label><input type="text" className="w-full border border-gray-300 rounded-lg p-3 outline-none" value={formData.breed} onChange={e => setFormData({...formData, breed: e.target.value})} /></div>
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4">
                            <h3 className="font-medium text-brand-green border-b pb-2 mb-2"><i className="fa-solid fa-network-wired mr-2"></i>สายเลือด</h3>
                            <div><label className="block text-sm font-medium mb-1 text-brand-brown">พ่อพันธุ์</label><select className="w-full border border-gray-300 rounded-lg p-3 outline-none bg-white" value={formData.fatherId} onChange={e => setFormData({...formData, fatherId: e.target.value})}><option value="">-- ไม่ระบุ --</option>{chickens.filter(c => c.type === 'พ่อพันธุ์').map(c => <option key={c.id} value={c.id}>{c.name} ({c.ringNumber})</option>)}</select></div>
                            <div><label className="block text-sm font-medium mb-1 text-brand-brown">แม่พันธุ์</label><select className="w-full border border-gray-300 rounded-lg p-3 outline-none bg-white" value={formData.motherId} onChange={e => setFormData({...formData, motherId: e.target.value})}><option value="">-- ไม่ระบุ --</option>{chickens.filter(c => c.type === 'แม่พันธุ์').map(c => <option key={c.id} value={c.id}>{c.name} ({c.ringNumber})</option>)}</select></div>

                        </div>
                        
                        <button onClick={() => saveChicken(formData)} disabled={isSaving} className={`w-full text-white font-semibold text-lg p-4 rounded-xl shadow-lg transition ${isSaving ? 'bg-gray-400' : 'bg-brand-green active:scale-95'}`}>
                            {isSaving ? 'กำลังบันทึกข้อมูล...' : <><i className="fa-solid fa-save mr-2"></i> บันทึกข้อมูล</>}
                        </button>
                        {formData.id && (
                             <button onClick={() => deleteChicken(formData.id)} disabled={isSaving} className="w-full bg-red-50 text-red-600 font-semibold text-lg p-4 rounded-xl border border-red-200 mt-2">ลบข้อมูล</button>
                        )}
                    </div>
                </div>
            );
        };

        const ChickenDetail = ({ id }) => {
            const c = chickens.find(x => x.id === id);
            if(!c) return <div className="p-4 text-center">ไม่พบข้อมูล</div>;

            const father = chickens.find(x => x.id === c.fatherId);
            const mother = chickens.find(x => x.id === c.motherId);
            const children = chickens.filter(x => x.fatherId === id || x.motherId === id);

            return (
                <div className="flex-1 flex flex-col h-full bg-brand-cream">
                    <div className="relative h-64 bg-gray-800">
                        {c.images && c.images.length > 0 ? <img src={c.images[0]} className="w-full h-full object-cover opacity-80" /> : <div className="w-full h-full flex items-center justify-center text-white"><i className="fa-solid fa-image text-4xl opacity-30"></i></div>}
                        <button onClick={() => navigateTo('home')} className="absolute top-6 left-4 w-10 h-10 bg-black bg-opacity-40 text-white rounded-full backdrop-blur flex items-center justify-center"><i className="fa-solid fa-chevron-left"></i></button>
                        <button onClick={() => navigateTo('add', c)} className="absolute top-6 right-4 w-10 h-10 bg-black bg-opacity-40 text-white rounded-full backdrop-blur flex items-center justify-center"><i className="fa-solid fa-pen"></i></button>
                        <div className="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-black to-transparent text-white">

                                <div className="w-2/3"><h1 className="text-3xl font-bold truncate">{c.name || 'ไม่มีชื่อ'}</h1><p className="opacity-90">{c.breed}</p></div>
                                <div className="bg-brand-green px-3 py-1 rounded-lg text-sm font-semibold shadow-md shrink-0">กิ๊ฟ: {c.ringNumber}</div>

                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 pb-24 space-y-4">
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between text-center text-brand-brown divide-x">
                            <div className="flex-1"><p className="text-xs text-gray-500 mb-1">สถานะ</p><p className="font-medium">{c.type}</p></div>
                            <div className="flex-1"><p className="text-xs text-gray-500 mb-1">ให้ลูก</p><p className="font-medium">{children.length} ตัว</p></div>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="font-medium text-brand-green mb-3"><i className="fa-solid fa-sitemap mr-2"></i>สายเลือด</h3>
                            <div className="grid grid-cols-2 gap-3">
                                <div onClick={() => father && navigateTo('detail', father.id)} className={`p-3 rounded-lg border ${father ? 'bg-blue-50 border-blue-100 cursor-pointer' : 'bg-gray-50 border-gray-100'}`}><p className="text-xs text-blue-600 font-medium mb-1">พ่อพันธุ์</p><p className="font-semibold text-brand-brown truncate">{father ? father.name : 'ไม่ระบุ'}</p></div>
                                <div onClick={() => mother && navigateTo('detail', mother.id)} className={`p-3 rounded-lg border ${mother ? 'bg-pink-50 border-pink-100 cursor-pointer' : 'bg-gray-50 border-gray-100'}`}><p className="text-xs text-pink-600 font-medium mb-1">แม่พันธุ์</p><p className="font-semibold text-brand-brown truncate">{mother ? mother.name : 'ไม่ระบุ'}</p></div>
                            </div>
                        </div>
                        {c.notes && (<div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100"><h3 className="font-medium text-brand-green mb-2"><i className="fa-solid fa-book mr-2"></i>หมายเหตุ</h3><p className="text-gray-600 text-sm whitespace-pre-line">{c.notes}</p></div>)}
                    </div>

        };
        
        let CurrentViewComponent = <Dashboard />;
        if (view.name === 'add') CurrentViewComponent = <AddForm initialValues={view.params} />;
        else if (view.name === 'detail') CurrentViewComponent = <ChickenDetail id={view.params} />;
        else if (view.name === 'parents') CurrentViewComponent = <ParentsView />;

        return (
            <React.Fragment>
                {CurrentViewComponent}
                {view.name === 'home' && (
                    <button onClick={() => navigateTo('add')} className="absolute bottom-20 right-6 w-14 h-14 bg-brand-accent text-white rounded-full shadow-lg flex items-center justify-center text-2xl hover:scale-105 active:scale-95 transition-transform z-30"><i className="fa-solid fa-plus"></i></button>
                )}
                <div className="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center pb-safe z-30 h-16 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                    {[{ id: 'home', icon: 'fa-home', label: 'หน้าหลัก' }, { id: 'parents', icon: 'fa-venus-mars', label: 'พ่อแม่พันธุ์' }, { id: 'bands', icon: 'fa-tags', label: 'กิ๊ฟปีก' }, { id: 'settings', icon: 'fa-cog', label: 'ตั้งค่า' }].map(tab => (
                        <button key={tab.id} onClick={() => navigateTo(tab.id)} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${currentTab === tab.id ? 'text-brand-green' : 'text-gray-400'}`}><i className={`fa-solid ${tab.icon} text-xl`}></i><span className="text-[10px] font-medium">{tab.label}</span></button>
                    ))}
                </div>
            </React.Fragment>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>

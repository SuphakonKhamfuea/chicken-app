<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Breeding Record</title>
    
    <!-- Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        brand: { green: '#1F4E3D', cream: '#F9F6F0', brown: '#5C4033', accent: '#D4A373' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { background-color: #e5e5e5; } 
        .no-scrollbar::-webkit-scrollbar { display: none; } 
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
    </style>

    <!-- Supabase JS Client v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://ptquiexaqmgbglhozzfw.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0cXVpZXhhcW1nYmdsaG96emZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NzMyNjUsImV4cCI6MjEwNDI0OTI2NX0.fO7VdqGmwYSL-UB8JYKCrJ4xmPzfaPNyvkMYvbFRsro";
        
        // แก้ไขจุดดึงฟังก์ชัน createClient จาก CDN v2 ให้ถูกต้อง
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>
<body class="flex justify-center">

<div id="app" class="w-full max-w-md h-screen bg-brand-cream relative overflow-hidden shadow-2xl flex flex-col">
    <!-- Header -->
    <div class="bg-brand-green text-white p-4 pt-6 rounded-b-2xl shadow-md z-10 flex items-center justify-between">
        <h1 class="text-xl font-semibold tracking-wide flex-1 text-center">Chicken Breeding Record</h1>
    </div>

    <!-- Content Area -->
    <div id="content" class="flex-1 overflow-y-auto no-scrollbar pb-24 p-4">
        <div class="text-center text-gray-500 mt-10">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- Floating Add Button -->
    <button onclick="showAddForm()" class="absolute bottom-20 right-6 w-14 h-14 bg-brand-accent text-white rounded-full shadow-lg flex items-center justify-center text-2xl active:scale-95 transition-transform z-30">
        <i class="fa-solid fa-plus"></i>
    </button>
</div>

<script>
    let chickens = [];

    async function loadChickens() {
        const content = document.getElementById('content');
        try {
            const { data, error } = await supabase.from('chickens').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            chickens = data || [];
            renderHome();
        } catch (err) {
            content.innerHTML = `<div class="text-center text-red-500 mt-10">เกิดข้อผิดพลาด: ${err.message}</div>`;
        }
    }

    function renderHome() {
        const content = document.getElementById('content');
        if (chickens.length === 0) {
            content.innerHTML = `<div class="text-center text-gray-400 mt-10">ยังไม่มีข้อมูลไก่ กดปุ่ม + ด้านล่างเพื่อเพิ่มข้อมูลแรกเลย!</div>`;
            return;
        }

        let html = '<div class="space-y-3">';
        chickens.forEach(c => {
            html += `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-brand-brown text-lg">${c.name || 'ไม่มีชื่อ'}</h3>
                        <p class="text-sm text-gray-500">${c.type || 'ลูกไก่'} • ${c.breed || 'ไม่ระบุสายพันธุ์'}</p>
                    </div>
                    <span class="text-sm font-semibold bg-brand-cream text-brand-brown px-3 py-1 rounded-lg border border-gray-200">#${c.ringNumber}</span>
                </div>
            `;
        });
        html += '</div>';
        content.innerHTML = html;
    }

    function showAddForm() {
        const content = document.getElementById('content');
        content.innerHTML = `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4">
                <h2 class="font-bold text-brand-brown text-lg border-b pb-2">เพิ่มข้อมูลไก่ใหม่</h2>
                <div>
                    <label class="block text-sm font-medium mb-1 text-brand-brown">หมายเลขกิ๊ฟปีก *</label>
                    <input type="text" id="ringNumber" class="w-full border border-gray-300 rounded-lg p-3 outline-none" placeholder="เช่น 001">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-brand-brown">ชื่อไก่</label>
                    <input type="text" id="name" class="w-full border border-gray-300 rounded-lg p-3 outline-none" placeholder="เช่น เจ้าพายุ">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-brand-brown">สถานะ</label>
                    <select id="type" class="w-full border border-gray-300 rounded-lg p-3 outline-none bg-white">
                        <option value="ลูกไก่">ลูกไก่</option>
                        <option value="พ่อพันธุ์">พ่อพันธุ์</option>
                        <option value="แม่พันธุ์">แม่พันธุ์</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="loadChickens()" class="flex-1 border border-gray-300 p-3 rounded-xl font-medium">ยกเลิก</button>
                    <button onclick="saveChicken()" id="saveBtn" class="flex-1 bg-brand-green text-white p-3 rounded-xl font-semibold shadow-md">บันทึกข้อมูล</button>
                </div>
            </div>
        `;
    }

    async function saveChicken() {
        const ringNumber = document.getElementById('ringNumber').value.trim();
        const name = document.getElementById('name').value.trim();
        const type = document.getElementById('type').value;
        const saveBtn = document.getElementById('saveBtn');

        if (!ringNumber) {
            alert('กรุณากรอกหมายเลขกิ๊ฟปีก');
            return;
        }

        saveBtn.disabled = true;
        saveBtn.innerText = 'กำลังบันทึก...';

        try {
            const { error } = await supabase.from('chickens').insert([{ ringNumber, name, type }]);
            if (error) throw error;
            await loadChickens();
        } catch (err) {
            alert('บันทึกไม่สำเร็จ: ' + err.message);
            saveBtn.disabled = false;
            saveBtn.innerText = 'บันทึกข้อมูล';
        }
    }

    window.onload = loadChickens;
</script>
</body>
</html>
